---
- name: Install haproxy
  hosts: haproxy
  become: true
  pre_tasks:
    - name: Wait for cert before use
      ansible.builtin.wait_for:
        path: "/etc/ssl/step.crt"
    - name: Wait for key before use
      ansible.builtin.wait_for:
        path: "/etc/ssl/step.key"
    - name: Concatenate key and cert
      ansible.builtin.command:
        cmd: cat /etc/ssl/step.crt /etc/ssl/step.key
      register: cert_bundle
      changed_when: cert_bundle.rc != 0
      failed_when: cert_bundle.rc != 0
    - name: Write cert bundle to file
      ansible.builtin.copy:
        owner: root
        group: root
        mode: "644"
        dest: /etc/ssl/step.pem
        content: "{{ cert_bundle.stdout }}"

  roles:
    - geerlingguy.haproxy
